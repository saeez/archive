<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Links · Saeed's archive</title>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="icon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="styles.css?v=9">
<script src="app.js?v=9" defer></script>
<script src="links.js?v=9" defer></script>
</head>
<body>

<svg class="sprite" aria-hidden="true">
  <symbol id="i-pen" viewBox="0 0 24 24"><path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8ZM14 2v6h6M8 13h8M8 17h5"/></symbol>
</svg>
<div class="glow" aria-hidden="true"><span></span><span></span><span></span></div>

<main class="page-main">
  <article id="links-window" class="course-window" hidden>
    <header class="course-top">
      <div class="course-head">
        <p id="link-count" class="label"></p>
        <h2>Links</h2>
      </div>
    </header>
    <div class="course-body">
      <div id="link-list" class="class-list"></div>
    </div>
  </article>
  <p id="nothing" class="label nothing" hidden>Nothing here. <a href="./">Back to the archive</a></p>
</main>

<div id="tools" class="detail-tools" hidden><button id="link-pen" class="icon-btn" type="button" title="Add or change a link" aria-label="Add or change a link"><svg class="icon" aria-hidden="true"><use href="#i-pen"/></svg></button></div>

<dialog id="link-editor">
  <form class="form-card">
    <p id="link-where" class="label" dir="auto"></p>
    <h2 id="link-form-title">Add a link</h2>
    <label class="field"><span class="label">Link</span><select name="which"></select></label>
    <label class="field"><span class="label">Title</span><input name="title" required maxlength="200" autocomplete="off"></label>
    <label class="field"><span class="label">Address</span><input name="url" type="url" required maxlength="2000" pattern="https?://.+" placeholder="https://…" autocomplete="off"></label>
    <label id="link-group-field" class="field"><span class="label">Group <small>(new name, new group)</small></span><input name="group" list="link-groups" maxlength="120" autocomplete="off"></label>
    <p id="link-error" class="error" role="alert"></p>
    <div class="actions">
      <button id="link-remove" class="icon-btn trash" type="button" title="Remove this link" aria-label="Remove this link" hidden><svg class="icon" aria-hidden="true"><use href="#i-trash"/></svg></button>
      <button id="link-cancel" class="ghost-btn" type="button">Cancel</button>
      <button id="link-save" class="solid-btn">Save</button>
    </div>
  </form>
</dialog>

<datalist id="link-groups"></datalist>

</body>
</html>
